[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coderenew"
version = "0.1.0"
description = "LLM-assisted modernization of legacy C++, with every change checked by the compiler and your tests."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nikhil Bhalala" }]
requires-python = ">=3.11"
dependencies = ["openai>=1.40", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
coderenew = "coderenew.cli:main"

[tool.setuptools.packages.find]
include = ["coderenew*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
